# 每日流水线：采集（job collect）→ 筛选排序 / L2 解读 / 校验（job daily）
#
# 两个 job 而不是一个：实测 CI 上采集要 59 分钟（基线池 2500 个仓库），
# 和解读挤在同一个 90 分钟的 job 里，解读必然被 timeout 掐在中途——花掉的
# token 全部作废。拆开后各自独立计时，采集超时也不影响已拿到的候选池。
#
# 不挂 pull_request 触发：PR 事件下 secrets 不可用，且 fork PR 不应拿到写权限。
# deploy job 在阶段三（前端）落地后再加，届时单独授予 pages 权限。
#
# 配置来自仓库 Settings → Secrets and variables → Actions：
#   Secrets   DEEPSEEK_API_KEY（必需）、S2_API_KEY（可选）
#   Variables DAI_LOOKBACK、DAI_SUMMARIZE_LIMIT、DAI_LOG_LEVEL、
#             DAI_SKIP_GITHUB、DAI_SKIP_BASELINE、DAI_SKIP_CITATIONS、
#             DAI_DRY_RUN、OPENALEX_MAILTO
# 未设置的 Variable 会展开成空字符串，脚本按"未设置"处理，所以不必全部填。

name: daily

on:
  schedule:
    # arXiv 01:00 UTC（美东 20:00）公告，10:30 UTC 起跑，落在公告后九个半小时。
    # 选这个点要同时满足两件事：
    #   1. 避开 DeepSeek 的 peak（工作日 01:00–04:00 与 06:00–10:00 UTC，单价
    #      是 off-peak 的两倍）。原来的 02:30 UTC 整段在 peak 里，实测一天
    #      2.76 CNY。
    #   2. 扛住 Actions schedule 的漂移。实测 16:30 UTC 的 cron 当天没起，
    #      GitHub 在次日 00:57 UTC 才跑——既掉回 peak，又早于当日公告，整期
    #      内容是前一两日的。10:30 起到次日 01:00 还有十四个半小时的 off-peak
    #      余量，比实测的 8.5 小时漂移宽出一截。
    # 代价是当期在北京时间 18:30 之后上线，晚上读。公告闸门（run_daily）在
    # 漂移真的大到越过 01:00 UTC 时兜底：空批次不投放，也不付 L2 的钱。
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "重跑指定批次日 YYYY-MM-DD（留空为当期）"
        required: false
        type: string
      lookback:
        description: "回溯天数（留空用配置默认值）"
        required: false
        type: string

# 同一时刻只跑一条流水线，避免手动触发与定时任务并发写同一批次文件
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # 非敏感配置统一走 Variables：调一个开关不必改 YAML，也不会进代码历史。
      # DAI_DATA_DIR 让 scripts.common 的 DATA_DIR 指向 data 分支的工作区。
      DAI_DATA_DIR: ${{ github.workspace }}/.data-branch/data
      DAI_LOOKBACK: ${{ vars.DAI_LOOKBACK }}
      DAI_LOG_LEVEL: ${{ vars.DAI_LOG_LEVEL }}
      DAI_SKIP_GITHUB: ${{ vars.DAI_SKIP_GITHUB }}
      DAI_SKIP_BASELINE: ${{ vars.DAI_SKIP_BASELINE }}
      DAI_SKIP_CITATIONS: ${{ vars.DAI_SKIP_CITATIONS }}
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
    steps:
      - uses: actions/checkout@v5

      # 数据放在孤立分支 data：成品、引用缓存、日志每天都变，混进 main
      # 的历史会让代码仓库的 clone 体积逐日膨胀。首次运行自动建分支。
      - name: 准备 data 分支工作区
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/data-branch.sh prepare

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 采集
        id: collect
        env:
          # Actions 内置 token 即可满足 Search 30/min 与 Core 5000/hr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        # 显式声明才会带上 pipefail；默认的 `bash -e` 下 `| tee` 会把
        # python 的非零退出码吞掉，collect 步骤永远判定为成功
        shell: bash
        run: |
          python -m scripts.collect_all \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.lookback && format('--lookback {0}', inputs.lookback) || '' }} \
            2>&1 | tee run.log

      # 候选池不进 data 分支（单批次约 8MB 且可重算），用 artifact 递给下一个 job。
      # 一并带上 raw/<批次>/arxiv.json：校验层的元数据核验优先读它，省掉对
      # 刚被限流的 export.arxiv.org 再发一轮回查。
      - name: 上传候选池
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pool
          path: |
            .data-branch/data/candidates
            .data-branch/data/raw/*/arxiv.json
          retention-days: 2

      # 即使采集失败也要 push：公共仓库 60 天无 push 会被 GitHub 自动
      # 停用 scheduled workflow，静默停掉整个站点的更新。
      - name: 写回数据与日志
        if: always()
        run: |
          bash .github/scripts/data-branch.sh push 采集 run.log \
            "${{ steps.collect.outcome == 'success' && '' || '（采集未成功，见 logs/）' }}"

  # 解读是唯一花钱的环节，所以 needs 采集成功才跑：采集失败时候选池是空的
  # 或者是上一期的，拿去解读既浪费 token 又会把旧内容当新一期投放。
  daily:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DAI_DATA_DIR: ${{ github.workspace }}/.data-branch/data
      DAI_SUMMARIZE_LIMIT: ${{ vars.DAI_SUMMARIZE_LIMIT }}
      DAI_LOG_LEVEL: ${{ vars.DAI_LOG_LEVEL }}
      DAI_DRY_RUN: ${{ vars.DAI_DRY_RUN }}
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
    steps:
      - uses: actions/checkout@v5

      - name: 准备 data 分支工作区
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/data-branch.sh prepare

      # artifact 的根是两个上传路径的公共父目录，即 data/，照原样铺回去
      - name: 取回候选池
        uses: actions/download-artifact@v8
        with:
          name: pool
          path: .data-branch/data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 筛选、解读与校验
        id: daily
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        shell: bash
        run: |
          python -m scripts.run_daily \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            2>&1 | tee run.log

      - name: 写回数据与日志
        if: always()
        run: |
          bash .github/scripts/data-branch.sh push 解读 run.log \
            "${{ steps.daily.outcome == 'success' && '' || '（解读未成功，见 logs/）' }}"
